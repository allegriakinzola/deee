services:
  postgres:
    image: postgres:16-alpine
    container_name: deee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deee
      POSTGRES_PASSWORD: deee
      POSTGRES_DB: deee
    ports:
      - "5432:5432"
    volumes:
      - deee_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deee -d deee"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deee_pg_data:
